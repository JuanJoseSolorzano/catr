[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catr"
version = "1.4.1"
authors = [
    { name="Juan Jose Solorzano", email="juanjose.solorzano.c@gmail.com" }
]
description = "A sleek terminal syntax highlighting file viewer."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pygments>=2.17.0",
    "colored>=1.4.4"
]

# Right side: package_folder.module_file:function_name
[project.scripts]
catr = "catr.catr:run"  # Creates the global 'catr' terminal command!

# Tells hatchling explicitly to look for your renamed directory inside src/
[tool.hatch.build.targets.wheel]
packages = ["src/catr"]
